<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The RAWS v3</title>

<style>
:root{
 --navy:#0b1f3a;
 --gold:#c5a253;
 --bg:#f5f6f8;
 --card:#fff;
 --ink:#17202a;
 --muted:#697386;
 --line:#d9dee7
}

*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:var(--bg);
 color:var(--ink)
}

header{
 background:var(--navy);
 color:white;
 padding:22px 18px
}

header h1{margin:0;font-size:26px}
header p{margin:5px 0 0;color:#d9e0eb}

.wrap{max-width:900px;margin:auto;padding:18px}

.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:12px;
 padding:18px;
 margin:14px 0;
 box-shadow:0 2px 8px #0000000a
}

h2{font-size:18px;margin:0 0 12px}
.small{font-size:13px;color:var(--muted)}

input,textarea,select{
 width:100%;
 padding:12px;
 border:1px solid #bcc5d1;
 border-radius:8px;
 font:inherit;
 margin:6px 0 10px
}

textarea{min-height:120px;resize:vertical}
.assessment{min-height:230px}
.forecast{min-height:150px}

button{
 border:0;
 border-radius:8px;
 padding:11px 14px;
 font-weight:700;
 cursor:pointer;
 margin:4px 6px 4px 0
}

.primary{background:var(--navy);color:#fff}
.secondary{background:#eef1f5;color:var(--ink)}
.gold{background:var(--gold);color:#111}
.hidden{display:none}

.item{
 border-top:1px solid var(--line);
 padding:10px 0;
 display:flex;
 gap:10px
}

.num{font-weight:700;min-width:22px}

.tag{
 display:inline-block;
 background:#eef1f5;
 border-radius:999px;
 padding:5px 9px;
 font-size:12px;
 margin:3px
}

.feedback{
 background:#fbfaf5;
 border-left:4px solid var(--gold);
 padding:14px;
 margin-top:10px
}

.profiles{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
 gap:8px
}

.profile{
 border:1px solid var(--line);
 background:#fff;
 text-align:left
}

.profile.selected{outline:3px solid var(--gold)}

.row{
 display:flex;
 gap:8px;
 align-items:center;
 flex-wrap:wrap
}

.row input[type=file]{width:auto;max-width:100%}
.count{font-size:13px;color:var(--muted);float:right}

@media(max-width:600px){
 .wrap{padding:10px}
 .card{padding:14px}
}
</style>
</head>

<body>

<header>
<h1>THE RAWS</h1>
<p>Read. Assess. Write. Source.</p>
</header>

<main class="wrap">

<section class="card" id="start">
<h2>Choose Your Workspace — V3</h2>

<p class="small">
<b>Workspace class:</b>
Professional • Higher Education • Student (13–17)
</p>

<p class="small">
Choose the workspace that best fits what you do.
This changes the analytical coaching, not your conclusions.
</p>

<div class="profiles" id="profiles"></div>

<button class="primary" onclick="createWorkspace()">
Create Your Workspace
</button>
</section>


<div id="workspace" class="hidden">

<section class="card">
<h2>
Workspace
<span id="profileTag" class="tag"></span>
</h2>

<label><b>Topic / Issue</b></label>

<input
 id="topic"
 placeholder="Enter the topic or issue you are assessing">
</section>


<section class="card">

<h2>
Public Supporting Information
<span class="count" id="publicCount">0 items</span>
</h2>

<label><b>Source / URL</b></
